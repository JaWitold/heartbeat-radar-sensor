; =============================================================================
; PlatformIO Project Configuration File
; Heartbeat Radar Sensor (Orthogonal Architecture)
; =============================================================================

[platformio]
default_envs = esp32dev

; Common configuration inherited by all board targets
[env]
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3
    ; Default composable targets (overridable via PLATFORMIO_BUILD_FLAGS)
    -DENABLE_SENSOR_LD2450=1
    -DENABLE_DISPLAY_ST7789=1

check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=missingIncludeSystem
    clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,cppcoreguidelines-*,modernize-*,performance-*,readability-*

; -----------------------------------------------------------------------------
; Board Target: ESP32 DevKit V1
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 115200
upload_speed = 921600

build_flags =
    ${env.build_flags}
    -DPLATFORM_ESP32=1
    ; Hardware SPI display parameters
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
