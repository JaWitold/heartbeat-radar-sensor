; =============================================================================
; PlatformIO Project Configuration File
; Heartbeat Radar Sensor (Orthogonal Architecture)
; =============================================================================

[platformio]
default_envs = esp32dev

; Common configuration inherited by all board targets
[env]
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    ; Config contract (.claude/rules/adapter-config.md):
    ;   - selection (ENABLE_SENSOR_*/ENABLE_DISPLAY_*) comes only from scripts/build.sh;
    ;     a plain `pio run` stops with an #error on purpose
    ;   - board wiring lives in [env:<board>] below
    ;   - adapter tunables are constexpr DEFAULT_* in the adapter; override with
    ;     ./scripts/build.sh -f NAME=value (RADAR_DANGER_DISTANCE_M, LD2450_BAUD_RATE, WIFI_TCP_PORT, ...)

check_tool = cppcheck, clangtidy
check_flags =
    cppcheck: --enable=all --inline-suppr --suppress=missingIncludeSystem --suppress=toomanyconfigs
    clangtidy: --checks=-*,bugprone-*,cert-*,clang-analyzer-*,cppcoreguidelines-*,modernize-*,performance-*,readability-*

; -----------------------------------------------------------------------------
; Board Target: ESP32 DevKit V1
; -----------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
; 1.9 MB app slots (default 1.25 MB) so the WiFi stack fits with headroom; keeps OTA, SPIFFS shrinks to 128 KB
board_build.partitions = min_spiffs.csv

build_flags =
    ${env.build_flags}
    -DPLATFORM_ESP32=1
    ; --- Board wiring (read only by src/main.cpp) ---
    ; Console UART, same rate as the monitor
    -DSERIAL_BAUD_RATE=${this.monitor_speed}
    ; LD2450 radar on UART2
    -DLD2450_RX_PIN=16
    -DLD2450_TX_PIN=17
    ; Buzzer audio alert
    -DBUZZER_PIN=25
    -DENABLE_BUZZER=1
    ; ST7789 on VSPI (TFT_eSPI-owned macro names, read by the library itself)
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
