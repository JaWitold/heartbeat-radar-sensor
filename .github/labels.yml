# Priority labels
- name: "priority:critical"
  color: "b60205"
  description: "Must fix immediately"
- name: "priority:high"
  color: "d93f0b"
  description: "Important, next sprint"
- name: "priority:medium"
  color: "fbca04"
  description: "Normal priority"
- name: "priority:low"
  color: "0e8a16"
  description: "Nice to have, backlog"

# Type labels
- name: "type:feature"
  color: "1d76db"
  description: "New feature or enhancement"
- name: "type:bug"
  color: "d73a4a"
  description: "Something isn't working"
- name: "type:chore"
  color: "e4e669"
  description: "Build, CI, tooling, or maintenance"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation improvements"
- name: "type:test"
  color: "bfd4f2"
  description: "Test additions or changes"

# Component labels
- name: "component:core"
  color: "5319e7"
  description: "Core domain logic (heartbeat detection, zone tracking)"
- name: "component:display"
  color: "c2e0c6"
  description: "Display adapter (OLED, TFT)"
- name: "component:sensor"
  color: "f9d0c4"
  description: "Sensor adapter (HLK-LD2450 UART)"
- name: "component:ci"
  color: "bfdadc"
  description: "CI/CD pipelines and automation"

# Status labels
- name: "status:idea"
  color: "d4c5f9"
  description: "Under consideration, not yet planned"
- name: "status:in-progress"
  color: "0052cc"
  description: "Actively being worked on"
- name: "status:blocked"
  color: "b60205"
  description: "Blocked by external dependency or decision"
- name: "status:needs-review"
  color: "ff9f1c"
  description: "Ready for review"
